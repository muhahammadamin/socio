<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Socio Панели</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
/* Layout: тёмный сайдбар + светлая рабочая область; три роли переключаются сверху */
:root{
  --font:'Manrope',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
  --bg:#f2f4fb;--surface:#fff;--ink:#141936;--muted:#646c8c;--line:#e5e8f3;
  --accent:#3b5bf0;--violet:#7c4dde;--side:#181b34;--side-ink:#aab0d2;
  --t-blue:#e8eeff;--t-green:#e2f6ea;--t-purple:#efe8fd;--t-orange:#fdefdc;
  --s-orange:#a8490a;--s-teal:#0f766e;--s-purple:#6b3fd4;--s-blue:#2447cf;--s-green:#13803f;--s-gray:#566080;
  --p-orange:#f59a23;--p-teal:#14a89a;--p-purple:#8657e8;--p-blue:#3b5bf0;--p-green:#22b05f;
  --m-bg:#e9eee4;--m-park:#cfe5c4;--m-water:#bcd8ec;--m-street:#f7f8f4;--m-road:#fff;--m-label:#59627f;
  --shadow:0 1px 2px rgba(20,25,54,.05),0 8px 24px rgba(20,25,54,.05);
  --crit:#d93a40;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  color-scheme:dark;
  --bg:#0e1124;--surface:#171b36;--ink:#eceffd;--muted:#9ba2c6;--line:#272c50;--side:#0a0c1d;--side-ink:#98a0c6;
  --accent:#6f8bff;
  --t-blue:#1b2550;--t-green:#12301f;--t-purple:#2a2055;--t-orange:#3a2a14;
  --s-orange:#f6b05a;--s-teal:#4fd1c1;--s-purple:#b79bff;--s-blue:#8ea6ff;--s-green:#5fd68e;--s-gray:#a3abcf;
  --m-bg:#1d2342;--m-park:#21402f;--m-water:#1f3a58;--m-street:#262c52;--m-road:#323a6a;--m-label:#a3abd0;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.25);--crit:#ff7b80;}}
:root[data-theme="dark"]{
  color-scheme:dark;
  --bg:#0e1124;--surface:#171b36;--ink:#eceffd;--muted:#9ba2c6;--line:#272c50;--side:#0a0c1d;--side-ink:#98a0c6;
  --accent:#6f8bff;
  --t-blue:#1b2550;--t-green:#12301f;--t-purple:#2a2055;--t-orange:#3a2a14;
  --s-orange:#f6b05a;--s-teal:#4fd1c1;--s-purple:#b79bff;--s-blue:#8ea6ff;--s-green:#5fd68e;--s-gray:#a3abcf;
  --m-bg:#1d2342;--m-park:#21402f;--m-water:#1f3a58;--m-street:#262c52;--m-road:#323a6a;--m-label:#a3abd0;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.25);--crit:#ff7b80;}

*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{font-family:var(--font);background:var(--bg);color:var(--ink);font-size:14px;line-height:1.45;display:flex;flex-direction:column;overflow:hidden}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
h1,h2,h3,p{margin:0}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.ic{width:1em;height:1em;flex:none;display:block}
.num{font-variant-numeric:tabular-nums}

/* верхняя полоса прототипа */
#protobar{flex:none;display:flex;align-items:center;gap:14px;padding:8px 16px;background:#0b0d1f;color:#c9cdea;font-size:12.5px;flex-wrap:wrap}
#protobar b{color:#fff;font-weight:700}
#protobar .seg{display:flex;gap:4px;background:#1a1e3d;padding:3px;border-radius:10px;margin-left:auto}
#protobar .seg button{border:0;background:transparent;color:#c9cdea;padding:6px 12px;border-radius:8px;font-weight:600;font-size:12.5px}
#protobar .seg button[aria-pressed="true"]{background:#fff;color:#141936}
#protobar .hint{opacity:.8}

#app{flex:1;min-height:0;display:grid;grid-template-columns:236px minmax(0,1fr)}
aside{background:var(--side);color:var(--side-ink);display:flex;flex-direction:column;padding:18px 12px;gap:6px;overflow-y:auto}
.logo{display:flex;align-items:center;gap:10px;padding:2px 8px 18px;color:#fff}
.logo svg{width:44px;height:40px;flex:none}
.logo strong{font-size:22px;font-weight:800;line-height:1;display:block;letter-spacing:-.3px}
.logo small{font-size:10.5px;color:var(--side-ink);font-weight:500}
.nav{display:flex;flex-direction:column;gap:3px}
.nav button{display:flex;align-items:center;gap:12px;border:0;background:transparent;color:var(--side-ink);padding:10px 12px;border-radius:10px;font-weight:600;text-align:left;width:100%}
.nav button .ic{font-size:18px}
.nav button:hover{background:rgba(255,255,255,.06);color:#fff}
.nav button[aria-current="page"]{background:var(--p-blue);color:#fff}
.nav .badge{margin-left:auto;background:#ef4444;color:#fff;border-radius:99px;min-width:20px;height:20px;padding:0 6px;font-size:11px;font-weight:700;display:grid;place-items:center}
.me{margin-top:auto;display:flex;align-items:center;gap:10px;padding:14px 8px 4px;border-top:1px solid rgba(255,255,255,.08);color:#fff}
.me small{display:block;color:var(--side-ink);font-size:11.5px}
.me b{font-size:13px}

.mainwrap{display:flex;flex-direction:column;min-width:0;min-height:0}
.topbar{flex:none;display:flex;align-items:center;gap:14px;padding:12px 24px}
.search{flex:1;max-width:760px;display:flex;align-items:center;gap:10px;background:var(--line);border-radius:99px;padding:0 16px;color:var(--muted)}
.search input{flex:1;border:0;background:transparent;padding:11px 0;outline:none;min-width:0}
.search:focus-within{outline:2px solid var(--accent)}
.spacer{flex:1}
.iconbtn{position:relative;border:0;background:transparent;width:40px;height:40px;border-radius:50%;display:grid;place-items:center;font-size:21px;color:var(--ink)}
.iconbtn:hover{background:var(--line)}
.iconbtn .badge{position:absolute;top:3px;right:2px;background:#ef4444;color:#fff;border-radius:99px;min-width:17px;height:17px;font-size:10.5px;font-weight:700;display:grid;place-items:center;padding:0 4px}
.content{flex:1;min-height:0;overflow-y:auto;padding:4px 24px 28px}

.av{border-radius:50%;display:grid;place-items:center;color:#fff;font-weight:700;flex:none;letter-spacing:.3px}
.head{display:flex;align-items:flex-start;gap:16px;margin:6px 0 18px;flex-wrap:wrap}
.head h1{font-size:24px;font-weight:800;letter-spacing:-.4px}
.head p{color:var(--muted);margin-top:2px}
.head .right{margin-left:auto;display:flex;gap:10px;align-items:center}
.card{background:var(--surface);border-radius:16px;box-shadow:var(--shadow);padding:18px;min-width:0}
.card h2{font-size:16.5px;font-weight:800;letter-spacing:-.2px}
.card .ch{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:12px}
.link{border:0;background:transparent;color:var(--accent);font-weight:700;display:inline-flex;align-items:center;gap:6px;padding:4px 0}
.link .ic{font-size:14px}
.btn{border:0;background:var(--accent);color:#fff;font-weight:700;padding:10px 18px;border-radius:10px;display:inline-flex;align-items:center;gap:8px;justify-content:center}
.btn:hover{filter:brightness(1.08)}
.btn.ghost{background:transparent;color:var(--accent);box-shadow:inset 0 0 0 1.5px var(--line)}
.btn.green{background:#1fa85c}
.btn.light{background:#fff;color:#141936}
.btn.sm{padding:6px 12px;font-size:12.5px;border-radius:8px}
.btn[disabled]{opacity:.5;cursor:not-allowed}
select,input[type=text],input[type=tel],textarea{border:1.5px solid var(--line);background:var(--surface);border-radius:10px;padding:9px 12px;width:100%;outline:none}
select:focus,input:focus,textarea:focus{border-color:var(--accent)}
textarea{resize:vertical;min-height:96px}
label.f{display:flex;flex-direction:column;gap:6px;font-weight:700;font-size:13px}
.err{color:var(--crit);font-weight:600;font-size:12.5px;min-height:0}

.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:16px;margin-bottom:18px}
.tile{display:flex;align-items:center;gap:14px;border-radius:16px;padding:16px 18px}
.tile .ti{width:46px;height:46px;border-radius:50%;display:grid;place-items:center;color:#fff;font-size:22px;flex:none}
.tile .tl{font-size:12.5px;font-weight:700;color:var(--muted)}
.tile .tv{font-size:28px;font-weight:800;letter-spacing:-.5px;line-height:1.1}
.tile .ts{font-size:11.5px;color:var(--muted);font-weight:600}
.tile.blue{background:var(--t-blue)}.tile.blue .ti{background:#3b5bf0}
.tile.green{background:var(--t-green)}.tile.green .ti{background:#22b05f}
.tile.purple{background:var(--t-purple)}.tile.purple .ti{background:#7c4dde}
.tile.orange{background:var(--t-orange)}.tile.orange .ti{background:#f59a23}

.grid3{display:grid;grid-template-columns:minmax(0,1.5fr) minmax(0,1.1fr) minmax(0,1fr);gap:16px;align-items:start}
.grid2{display:grid;grid-template-columns:minmax(0,1.5fr) minmax(0,1fr);gap:16px;align-items:start}
.stack{display:flex;flex-direction:column;gap:16px;min-width:0}

.rows{display:flex;flex-direction:column}
.row{display:flex;align-items:center;gap:12px;padding:10px 4px;border-bottom:1px solid var(--line);width:100%;background:transparent;border-left:0;border-right:0;border-top:0;text-align:left}
.row:last-child{border-bottom:0}
button.row:hover{background:color-mix(in srgb,var(--accent) 5%,transparent)}
.row .grow{flex:1;min-width:0}
.row .t{font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:13.5px}
.row .s{font-size:12px;color:var(--muted);display:flex;align-items:center;gap:4px}
.row .s .ic{font-size:12px}
.row time{font-size:12px;color:var(--muted);white-space:nowrap}
.cico{width:28px;height:28px;border-radius:50%;display:grid;place-items:center;font-size:15px;color:var(--c);background:color-mix(in srgb,var(--c) 16%,transparent);flex:none}
.pill{display:inline-flex;align-items:center;gap:6px;border-radius:99px;padding:3px 11px;font-size:12px;font-weight:700;white-space:nowrap;--x:var(--s-gray);color:var(--x);background:color-mix(in srgb,var(--x) 14%,transparent)}
.pill::before{content:"";width:6px;height:6px;border-radius:50%;background:var(--x)}
.pill.orange{--x:var(--s-orange)}.pill.teal{--x:var(--s-teal)}.pill.purple{--x:var(--s-purple)}.pill.blue{--x:var(--s-blue)}.pill.green{--x:var(--s-green)}

.map{display:block;width:100%;height:auto;border-radius:12px;background:var(--m-bg)}
.map .mcity{font-size:13px;font-weight:800;fill:var(--m-label);text-anchor:middle}
.map .ml{font-size:7.5px;font-weight:700;fill:var(--m-label);text-anchor:middle;opacity:.85}
.map .pin{cursor:pointer}
.map .pin:hover path{filter:brightness(1.1)}
.map[data-pick]{cursor:crosshair}
.legend{display:flex;gap:6px 14px;flex-wrap:wrap;font-size:12px;color:var(--muted);font-weight:600;margin-top:10px}
.legend i{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:6px}

.donutwrap{display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.donut{width:150px;height:150px;flex:none}
.donut text{text-anchor:middle;fill:var(--ink)}
.dleg{flex:1;min-width:150px;display:flex;flex-direction:column;gap:9px;font-size:13px}
.dleg div{display:flex;align-items:center;gap:8px}
.dleg i{width:9px;height:9px;border-radius:50%;flex:none}
.dleg b{margin-left:auto}

.banner{border-radius:16px;padding:20px;color:#fff;background:linear-gradient(120deg,#5b3bd6,#9a58e8 70%,#c58df0);display:flex;align-items:center;gap:14px;overflow:hidden}
.banner .ic{font-size:46px;flex:none;opacity:.95}
.banner b{font-size:16px;display:block;line-height:1.25}
.banner span{font-size:12.5px;opacity:.9}
.hero{border-radius:20px;padding:34px 32px;color:#fff;background:radial-gradient(circle at 85% 30%,rgba(124,77,222,.55),transparent 45%),radial-gradient(circle at 70% 90%,rgba(59,91,240,.5),transparent 45%),#1a1f3f;position:relative;overflow:hidden;margin-bottom:16px}
.hero h1{font-size:34px;font-weight:800;letter-spacing:-.6px}
.hero p{margin:10px 0 20px;max-width:430px;font-size:16px;opacity:.9}
.hero .bg{position:absolute;right:-20px;top:50%;transform:translateY(-50%);font-size:230px;opacity:.14;color:#fff}

.table-wrap{overflow-x:auto}
table{width:100%;border-collapse:collapse;min-width:720px}
th{font-size:12px;color:var(--muted);text-align:left;font-weight:700;padding:8px 10px;border-bottom:1.5px solid var(--line);white-space:nowrap}
td{padding:11px 10px;border-bottom:1px solid var(--line);vertical-align:middle}
tr:last-child td{border-bottom:0}
td .tt{font-weight:700;background:transparent;border:0;padding:0;text-align:left;color:var(--ink)}
td .tt:hover{color:var(--accent);text-decoration:underline}
td select{min-width:190px;padding:7px 10px}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px}
.chip{border:1.5px solid var(--line);background:var(--surface);border-radius:99px;padding:6px 14px;font-weight:700;font-size:12.5px;color:var(--muted);display:inline-flex;gap:8px;align-items:center}
.chip[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:#fff}
.chip.cat[aria-pressed="true"]{background:var(--c);border-color:var(--c)}

.hcard{display:grid;grid-template-columns:auto 1fr;gap:14px;padding:16px 0;border-bottom:1px solid var(--line)}
.hcard:last-child{border-bottom:0;padding-bottom:0}
.hcard:first-child{padding-top:0}
.hcard .big{width:64px;height:64px;border-radius:16px;display:grid;place-items:center;font-size:30px;color:var(--c);background:color-mix(in srgb,var(--c) 15%,transparent)}
.hcard h3{font-size:16px;font-weight:800}
.hcard .d{color:var(--muted);margin:4px 0 8px}
.meta{display:flex;gap:6px 18px;flex-wrap:wrap;color:var(--muted);font-size:12.5px;font-weight:600}
.meta span{display:inline-flex;align-items:center;gap:6px}
.hcard .foot{display:flex;align-items:center;gap:10px;margin-top:12px;flex-wrap:wrap}
.empty{padding:26px 10px;text-align:center;color:var(--muted)}
.empty b{display:block;color:var(--ink);font-size:15px;margin-bottom:4px}

.formgrid{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,1fr);gap:20px}
.fcol{display:flex;flex-direction:column;gap:14px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.note{font-size:12px;color:var(--muted)}

.switch{position:relative;width:46px;height:26px;border-radius:99px;border:0;background:var(--line);flex:none}
.switch::after{content:"";position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:50%;background:#fff;transition:transform .15s;box-shadow:0 1px 3px rgba(0,0,0,.3)}
.switch[aria-checked="true"]{background:#22b05f}
.switch[aria-checked="true"]::after{transform:translateX(20px)}
.setrow{display:flex;align-items:center;gap:14px;padding:14px 0;border-bottom:1px solid var(--line)}
.setrow:last-child{border-bottom:0}
.setrow div{flex:1}.setrow b{display:block}.setrow span{color:var(--muted);font-size:12.5px}

.bars{display:flex;flex-direction:column;gap:12px}
.bar{display:grid;grid-template-columns:150px 1fr 40px;align-items:center;gap:10px;font-size:13px;font-weight:600}
.bar .trk{height:12px;background:var(--line);border-radius:99px;overflow:hidden}
.bar .fill{height:100%;border-radius:99px;background:var(--c,var(--accent))}
.bar b{text-align:right}
.chart{width:100%;height:auto;display:block}
.chart text{font-size:10px;fill:var(--muted);font-family:var(--font)}
.chart .gl{stroke:var(--line);stroke-width:1}
.chart rect.b{fill:var(--accent)}
.chart rect.b:hover{filter:brightness(1.15)}

.modalback{position:fixed;inset:0;background:rgba(10,12,31,.55);display:grid;place-items:center;padding:16px;z-index:50}
.modal{background:var(--surface);border-radius:20px;width:min(720px,100%);max-height:92%;overflow-y:auto;padding:22px;box-shadow:0 20px 60px rgba(0,0,0,.4)}
.modal.wide{width:min(900px,100%)}
.modal .mh{display:flex;align-items:flex-start;gap:12px;margin-bottom:14px}
.modal .mh h2{font-size:20px;font-weight:800;flex:1}
.timeline{display:flex;gap:0;margin:16px 0;list-style:none;padding:0}
.timeline li{flex:1;text-align:center;font-size:11.5px;font-weight:700;color:var(--muted);position:relative;padding-top:24px}
.timeline li::before{content:"";position:absolute;top:6px;left:50%;width:12px;height:12px;margin-left:-6px;border-radius:50%;background:var(--line);z-index:1}
.timeline li::after{content:"";position:absolute;top:11px;left:-50%;width:100%;height:2px;background:var(--line)}
.timeline li:first-child::after{display:none}
.timeline li.on{color:var(--ink)}
.timeline li.on::before,.timeline li.on::after{background:var(--p-green)}
.timeline small{display:block;font-weight:500;color:var(--muted);font-size:11px}
.kv{display:grid;grid-template-columns:auto 1fr;gap:6px 16px;margin:12px 0}
.kv dt{color:var(--muted);font-weight:600}.kv dd{margin:0;font-weight:700}

#toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%) translateY(20px);background:#141936;color:#fff;padding:11px 18px;border-radius:12px;font-weight:600;opacity:0;pointer-events:none;transition:.2s;z-index:80;max-width:calc(100% - 32px)}
#toast.on{opacity:1;transform:translateX(-50%)}

.login{grid-column:1/-1;display:grid;place-items:center;padding:24px;overflow-y:auto}
.login .box{width:min(880px,100%);text-align:center}
.login .logo{justify-content:center;color:var(--ink);padding-bottom:6px}
.login .logo small{color:var(--muted)}
.login h1{font-size:26px;font-weight:800;margin:14px 0 4px}
.login p{color:var(--muted);margin-bottom:22px}
.roles{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:16px;text-align:left}
.rolecard{border:0;background:var(--surface);box-shadow:var(--shadow);border-radius:18px;padding:20px;display:flex;flex-direction:column;gap:8px;text-align:left}
.rolecard:hover{outline:2px solid var(--accent)}
.rolecard .ti{width:44px;height:44px;border-radius:12px;display:grid;place-items:center;color:#fff;font-size:22px}
.rolecard b{font-size:16px}.rolecard span{color:var(--muted);font-size:13px}

@media (max-width:1180px){.grid3{grid-template-columns:minmax(0,1fr) minmax(0,1fr)}.grid3>.stack:first-child{grid-column:1/-1}}
@media (max-width:860px){
  #app{grid-template-columns:1fr;grid-template-rows:auto minmax(0,1fr)}
  aside{flex-direction:row;align-items:center;padding:8px 10px;overflow-x:auto;overflow-y:hidden;gap:8px}
  .logo{padding:0 8px 0 0}.logo small,.me{display:none}
  .nav{flex-direction:row}.nav button{white-space:nowrap;padding:8px 12px}
  .grid3,.grid2,.formgrid{grid-template-columns:1fr}
  .topbar{padding:10px 14px}.content{padding:4px 14px 24px}
  #protobar .hint{display:none}#protobar .seg{margin-left:0}
  .bar{grid-template-columns:110px 1fr 34px}
  .hero{padding:24px 20px}.hero h1{font-size:26px}
}
@media (max-width:520px){.two{grid-template-columns:1fr}.hcard{grid-template-columns:1fr}.timeline li{font-size:10px}}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<div id="protobar"><b>Socio · прототип</b><span class="hint">Создайте заявку как человек, назначьте помощника как админ, завершите её как помощник.</span>
<div class="seg" role="group" aria-label="Роль"><button data-act="role" data-r="admin" aria-pressed="false">Админ</button><button data-act="role" data-r="helper" aria-pressed="false">Помощник</button><button data-act="role" data-r="user" aria-pressed="false">Нужна помощь</button></div></div>
<div id="app"></div>
<div id="modal"></div>
<div id="toast" role="status" aria-live="polite"></div>
<script>
(function(){
'use strict';
var $=function(s){return document.querySelector(s)};
var esc=function(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})};
var MIN=6e4,HOUR=36e5,DAY=864e5;

/* ---------- иконки ---------- */

  '<div class="setrow"><div><b>Выполнено задач</b></div><b class="num" style="font-size:20px;flex:none">'+doneCount(h)+'</b></div><div class="setrow"><div><b>Рейтинг</b></div><b class="num" style="font-size:20px;flex:none">'+h.rating.toFixed(1)+' ★</b></div></div>'}
function helperStats(){var h=meH(),mine=D().reqs.filter(function(r){return r.hid===h.id&&r.status==='done'});
  return head('Статистика','Ваши выполненные заявки по категориям')+'<div class="card" style="max-width:720px">'+barRows(D().cats.map(function(c){return {l:c.n,v:mine.filter(function(r){return r.cat===c.n}).length,c:c.c}}))+'<p class="note" style="margin-top:14px">Считаются заявки, выполненные через платформу. Прошлые '+h.base+' заданий в разбивку не входят.</p></div>'}

/* ---------- человек, которому нужна помощь ---------- */
function userHome(){
  var u=meU(),my=D().reqs.filter(function(r){return r.uid===u.id}).sort(function(a,b){return b.ts-a.ts}).slice(0,3);
  return '<div class="hero"><span class="bg">'+ic('heart',230)+'</span><h1>Нужна помощь?</h1><p>Мы рядом. Опишите свою ситуацию и мы найдём помощника!</p><button class="btn light" data-act="go" data-v="new">'+ic('heart',18)+'Получить помощь</button></div>'+
  '<div class="grid2"><div class="card"><div class="ch"><h2>Мои заявки</h2><button class="link" data-act="go" data-v="mine">Все заявки '+ic('arrow')+'</button></div>'+(my.length?'<div class="rows">'+my.map(myRow).join('')+'</div>':empty('Заявок пока нет','Нажмите «Получить помощь», чтобы создать первую.'))+'</div>'+
  '<div class="stack"><div class="card"><div class="ch"><h2>Ваш баланс добра</h2></div><div style="display:flex;align-items:center;gap:12px"><span style="color:#ef4444">'+ic('heart',40)+'</span><b class="num" style="font-size:40px;line-height:1">'+D().balance+'</b></div><div class="note" style="margin-top:6px">Помогли людям. Растёт, когда вы благодарите помощника.</div></div>'+
  '<div class="banner">'+ic('heart')+'<div><b>Спасибо, что делаете мир лучше!</b><span>Каждая заявка помогает нам быть полезнее</span></div></div></div></div>'}
function myRow(r){var hn=hName(r);
  return '<div class="row">'+cico(r.cat)+'<span class="grow"><span class="t" style="display:block">'+esc(r.title)+'</span><span class="s">'+ic('clock')+fdate(r.ts)+(hn?' · '+esc(hn):' · помощник ещё не назначен')+'</span></span>'+pill(r.status)+'<button class="link" data-act="open" data-id="'+r.id+'">Подробнее '+ic('arrow')+'</button></div>'}
function userMine(){
  var my=D().reqs.filter(function(r){return r.uid===meU().id}).sort(function(a,b){return b.ts-a.ts});
  return head('Мои заявки','Следите, как идёт помощь',  '<button class="btn" data-act="go" data-v="new">'+ic('plus',16)+'Новая заявка</button>')+'<div class="card">'+(my.length?'<div class="rows">'+my.map(myRow).join('')+'</div>':empty('Заявок пока нет','Создайте первую заявку.'))+'</div>'}
function userNew(){
  var u=meU(),f=S.form||(S.form={cat:D().cats[0].n,x:DIST[u.dist][0],y:DIST[u.dist][1],dist:u.dist});
  return head('Получить помощь','Опишите ситуацию. Администратор подберёт помощника.')+
  '<form id="reqform" class="card" novalidate><div class="formgrid"><div class="fcol">'+
  '<div><div style="font-weight:700;font-size:13px;margin-bottom:8px" id="catlbl">Категория</div><div class="chips" role="group" aria-labelledby="catlbl" id="catchips" style="margin:0">'+D().cats.map(function(c){return '<button type="button" class="chip cat" style="--c:'+c.c+'" data-act="pickcat" data-c="'+esc(c.n)+'" aria-pressed="'+(f.cat===c.n)+'">'+esc(c.n)+'</button>'}).join('')+'</div></div>'+
  '<label class="f">Что нужно<input id="f-title" type="text" maxlength="80" placeholder="Например, купить продукты" autocomplete="off"><span class="err" id="e-title"></span></label>'+
  '<label class="f">Опишите ситуацию<textarea id="f-desc" maxlength="500" placeholder="Что случилось и какая помощь нужна"></textarea><span class="err" id="e-desc"></span></label>'+
  '<div class="two"><label class="f">Когда нужна помощь<select id="f-due"><option value="1">Сегодня</option><option value="2">В течение 2 дней</option><option value="3" selected>В течение 3 дней</option><option value="7">На этой неделе</option></select></label>'+
  '<label class="f">Телефон<input id="f-phone" type="tel" value="'+esc(u.phone)+'"><span class="err" id="e-phone"></span></label></div></div>'+
  '<div class="fcol"><label class="f">Район<select id="f-dist">'+DNAMES.map(function(n){return '<option'+(f.dist===n?' selected':'')+'>'+n+'</option>'}).join('')+'</select></label>'+
  '<label class="f">Адрес<input id="f-addr" type="text" placeholder="Улица, дом, ориентир" autocomplete="off"><span class="err" id="e-addr"></span></label>'+
  '<div><div style="font-weight:700;font-size:13px;margin-bottom:8px">Ваша локация</div><div id="formmap">'+formMap()+'</div><p class="note" style="margin-top:8px" id="loctxt">'+locText()+'</p></div>'+
  '<button class="btn" type="submit" style="margin-top:4px">'+ic('pin',16)+'Отправить заявку с локацией</button></div></div></form>'}
function formMap(){var f=S.form;return mapSVG([{x:f.x,y:f.y,t:'Вы здесь',c:'var(--p-blue)'}],{pick:1,labels:1})}
function locText(){var f=S.form;return 'Нажмите на карту, чтобы поставить точку. Район: <b>'+esc(f.dist)+'</b>. Геолокация браузера в прототипе отключена.'}
function userProfile(){var u=meU(),n=D().reqs.filter(function(r){return r.uid===u.id});
  return head('Профиль')+'<div class="card" style="max-width:640px"><div style="display:flex;gap:16px;align-items:center;margin-bottom:10px">'+av(u.name,64)+'<div><h2 style="font-size:20px">'+esc(u.name)+'</h2><div class="note">'+esc(u.phone)+' · '+esc(u.dist)+'</div></div></div>'+
  '<div class="setrow"><div><b>Заявок создано</b></div><b class="num" style="font-size:20px;flex:none">'+n.length+'</b></div><div class="setrow"><div><b>Баланс добра</b></div><b class="num" style="font-size:20px;flex:none">'+D().balance+'</b></div></div>'}
function notesView(){
  var l=D().notes.filter(function(n){return n.to===S.role}).sort(function(a,b){return b.ts-a.ts});
  return head('Уведомления')+'<div class="card">'+(l.length?'<div class="rows">'+l.map(function(n){var f=S.fresh.indexOf(n.id)>=0;return '<div class="row"><span class="cico" style="--c:'+(f?'var(--p-blue)':'#8a90b0')+'">'+ic('bell',15)+'</span><span class="grow"><span class="t" style="white-space:normal;'+(f?'':'font-weight:600')+'">'+esc(n.text)+'</span></span><time>'+ago(n.ts)+'</time></div>'}).join('')+'</div>':empty('Уведомлений нет','Здесь появятся новости по заявкам.'))+'</div>'}

var VIEWS={
 admin:{home:adminHome,all:adminAll,vols:adminVols,helpers:adminHelpers,users:adminUsers,stats:adminStats,cats:adminCats,settings:adminSettings,complaints:adminComplaints,notes:notesView},
 helper:{home:helperHome,mine:helperMine,history:helperHistory,profile:helperProfile,notes:notesView,stats:helperStats},
 user:{home:userHome,mine:userMine,new:userNew,profile:userProfile,notes:notesView}};
function view(){var f=VIEWS[S.role][S.view]||VIEWS[S.role].home;return f()}

/* ---------- модальные окна ---------- */
function modalHTML(){
  var m=S.modal;if(!m)return '';
  if(m.t==='map'){
    var l=D().reqs.filter(function(r){return r.status!=='done'&&(S.role!=='helper'||r.hid==='h1')});
    return '<div class="modalback" data-act="close" data-bg="1"><div class="modal wide" role="dialog" aria-modal="true" aria-label="Карта заявок"><div class="mh"><h2>Карта заявок</h2><button class="iconbtn" data-act="close" aria-label="Закрыть">'+ic('x')+'</button></div>'+mapSVG(reqPins(l),{labels:true})+legend()+'<p class="note" style="margin-top:8px">Нажмите на метку, чтобы открыть заявку.</p></div></div>'}
  var r=reqById(m.id);if(!r)return '';
  var c=catOf(r.cat),hn=hName(r),h=byId(D().helpers,r.hid),idx=ORDER.indexOf(r.status);
  var tl='<ol class="timeline" aria-label="Ход выполнения">'+ORDER.map(function(s,i){var e=r.log.filter(function(x){return x.s===s})[0];return '<li class="'+(i<=idx?'on':'')+'">'+STEPT[s]+'<small>'+(e?fdate(e.ts)+' '+ftime(e.ts):'—')+'</small></li>'}).join('')+'</ol>';
  var act='';
  if(S.role==='admin'&&(r.status==='new'||r.status==='assigned'))act='<label class="f">Помощник'+helperSelect(r)+'</label>';
  if(S.role==='helper'&&r.hid==='h1')act=taskBtn(r);
  if(S.role==='user'&&r.uid==='u1'&&r.status==='done')act=r.thanked?'<span class="pill green">Вы сказали спасибо</span>':'<button class="btn" data-act="thanks" data-id="'+r.id+'">'+ic('heart',16)+'Сказать спасибо помощнику</button>';
  return '<div class="modalback" data-act="close" data-bg="1"><div class="modal" role="dialog" aria-modal="true" aria-label="Заявка"><div class="mh"><span class="cico" style="--c:'+c.c+';width:40px;height:40px">'+ic(c.i,20)+'</span><h2>'+esc(r.title)+'</h2><button class="iconbtn" data-act="close" aria-label="Закрыть">'+ic('x')+'</button></div>'+
  '<div style="display:flex;gap:8px;flex-wrap:wrap;margin-bottom:8px">'+pill(r.status)+'<span class="pill" style="--x:'+c.c+'">'+esc(c.n)+'</span></div><p>'+esc(r.desc)+'</p>'+tl+
  '<dl class="kv"><dt>Кому нужна помощь</dt><dd>'+esc(uName(r))+'</dd><dt>Где</dt><dd>'+esc(r.dist)+', '+esc(r.addr)+'</dd><dt>Помощник</dt><dd>'+(hn?esc(hn):'ещё не назначен')+'</dd><dt>Срок</dt><dd>'+(r.status==='done'?'выполнена':dueText(r))+'</dd></dl>'+
  mapSVG([{x:r.x,y:r.y,t:r.title,c:'var('+ST[r.status].p+')'}])+(act?'<div style="margin-top:16px;display:flex;gap:10px;flex-wrap:wrap">'+act+'</div>':'')+'</div></div>'}

/* ---------- рендер ---------- */
function render(){
  var a=document.activeElement,keep=(a&&a.id==='q')?a.selectionStart:null,sc=$('#content'),top=sc?sc.scrollTop:0;
  $('#app').innerHTML=S.role?shell():login();
  $('#modal').innerHTML=modalHTML();
  var c=$('#content');if(c&&S.keepScroll!==false)c.scrollTop=top;
  if(keep!==null){var q=$('#q');if(q){q.focus();q.setSelectionRange(keep,keep)}}
  document.querySelectorAll('#protobar .seg button').forEach(function(b){b.setAttribute('aria-pressed',String(b.dataset.r===S.role))});
  if(S.modal){var d=$('.modal');if(d&&!d.contains(document.activeElement)){var cb=d.querySelector('button');if(cb&&a&&a.id!=='q'){}}}
}
function go(v){
  S.view=v;S.modal=null;S.errs={};S.keepScroll=false;
  if(v==='notes'){S.fresh=D().notes.filter(function(n){return n.to===S.role&&!n.read}).map(function(n){return n.id});D().notes.forEach(function(n){if(n.to===S.role)n.read=true})}
  if(v==='new')S.form=null;
  render();S.keepScroll=true;var c=$('#content');if(c)c.scrollTop=0}
function setRole(r){S.role=r;S.q='';S.filter='all';S.view='home';S.modal=null;S.form=null;render();var c=$('#content');if(c)c.scrollTop=0}

/* ---------- действия ---------- */
function setStatus(r,s){r.status=s;r.log.push({s:s,ts:Date.now()})}
function assign(id,hid){
  var r=reqById(id),h=byId(D().helpers,hid);if(!r||!h||(r.status!=='new'&&r.status!=='assigned'))return;
  r.hid=hid;if(r.status==='new')setStatus(r,'assigned');
  note('helper',h.id==='h1'?'Вам назначена заявка «'+r.title+'»':'Помощнику '+h.name+' назначена заявка «'+r.title+'»');
  note('user','Для заявки «'+r.title+'» назначен помощник '+h.name);
  toast('Помощник '+h.name+' назначен на заявку');render()}
var ACT={
 go:function(d){go(d.v)},
 role:function(d){setRole(d.r)},
 logout:function(){S.role=null;S.modal=null;render()},
 open:function(d){S.modal={t:'req',id:+d.id};render()},
 map:function(){S.modal={t:'map'};render()},
 close:function(d,e){if(d.bg&&e.target!==e.currentTarget)return;S.modal=null;render()},
 filter:function(d){S.filter=d.f;render()},
 accept:function(d){var r=reqById(d.id);setStatus(r,'accepted');note('admin','Помощник '+hName(r)+' принял заявку «'+r.title+'»');note('user','Помощник принял вашу заявку «'+r.title+'»');toast('Заявка принята');render()},
 start:function(d){var r=reqById(d.id);setStatus(r,'progress');note('user','Помощник начал помогать по заявке «'+r.title+'»');toast('Вы начали помощь');render()},
 finish:function(d){var r=reqById(d.id);setStatus(r,'done');note('admin','Заявка «'+r.title+'» выполнена');note('user','Заявка «'+r.title+'» выполнена. Скажите спасибо помощнику');toast('Спасибо! Помощь завершена');render()},
 thanks:function(d){var r=reqById(d.id);if(r.thanked)return;r.thanked=true;D().balance++;note('helper','Вам сказали спасибо за «'+r.title+'»');toast('Баланс добра: '+D().balance);render()},
 approve:function(d){var v=byId(D().vols,d.id);D().vols=D().vols.filter(function(x){return x.id!==d.id});D().helpers.push({id:'h'+Date.now(),name:v.name,phone:v.phone,dist:v.dist,base:0,bp:0,rating:5,avail:true});toast(v.name+' теперь помощник');render()},
 avail:function(d){var h=byId(D().helpers,d.id);h.avail=!h.avail;render()},
 resolve:function(d){D().complaints.forEach(function(c){if(c.id===+d.id)c.status='closed'});render()},
 theme:function(){var cur=document.documentElement.dataset.theme?document.documentElement.dataset.theme==='dark':matchMedia('(prefers-color-scheme:dark)').matches;document.documentElement.dataset.theme=cur?'light':'dark';render()},
 reset:function(){RID=0;S.data=seed();S.form=null;toast('Демо-данные восстановлены');render()},
 pickcat:function(d){S.form.cat=d.c;document.querySelectorAll('#catchips .chip').forEach(function(b){b.setAttribute('aria-pressed',String(b.dataset.c===d.c))})}
};
document.addEventListener('click',function(e){
  var pm=e.target.closest('[data-pick]');
  if(pm&&!e.target.closest('.pin')&&S.form){var r=pm.getBoundingClientRect();S.form.x=(e.clientX-r.left)/r.width*400;S.form.y=(e.clientY-r.top)/r.height*260;S.form.dist=nearestDist(S.form.x,S.form.y);
    $('#formmap').innerHTML=formMap();$('#f-dist').value=S.form.dist;$('#loctxt').innerHTML=locText();return}
  var t=e.target.closest('[data-act]');if(!t)return;
  if(t.dataset.bg&&e.target!==t)return;
  if(ACT[t.dataset.act])ACT[t.dataset.act](t.dataset,e)});
document.addEventListener('keydown',function(e){
  if(e.key==='Escape'&&S.modal){S.modal=null;render()}
  if((e.key==='Enter'||e.key===' ')&&e.target.matches&&e.target.matches('.pin')){e.preventDefault();ACT.open(e.target.dataset)}});
document.addEventListener('change',function(e){var t=e.target;
  if(t.id==='period'){S.period=t.value==='all'?'all':+t.value;render()}
  else if(t.dataset.change==='assign'){if(t.value)assign(+t.dataset.id,t.value)}
  else if(t.id==='f-dist'&&S.form){S.form.dist=t.value;S.form.x=DIST[t.value][0];S.form.y=DIST[t.value][1];$('#formmap').innerHTML=formMap();$('#loctxt').innerHTML=locText()}});
document.addEventListener('input',function(e){if(e.target.id==='q'){S.q=e.target.value;if(S.view!=='all'){S.view='all';S.filter='all'}render()}});
document.addEventListener('submit',function(e){e.preventDefault();var id=e.target.id;
  function fail(k,m){var el=$('#'+k);if(el)el.textContent=m}
  if(id==='reqform'){
    var t=$('#f-title').value.trim(),ds=$('#f-desc').value.trim(),ad=$('#f-addr').value.trim(),ph=$('#f-phone').value.trim(),ok=true;
    ['e-title','e-desc','e-addr','e-phone'].forEach(function(k){fail(k,'')});
    if(t.length<3){fail('e-title','Напишите коротко, что нужно (от 3 символов).');ok=false}
    if(ds.length<10){fail('e-desc','Опишите ситуацию подробнее (от 10 символов).');ok=false}
    if(ad.length<3){fail('e-addr','Укажите улицу и дом или ориентир.');ok=false}
    if(ph.replace(/\D/g,'').length<9){fail('e-phone','Введите телефон с кодом, например +998 90 123-45-67.');ok=false}
    if(!ok){var first=document.querySelector('.err:not(:empty)');if(first)first.parentElement.querySelector('input,textarea').focus();return}
    var f=S.form,r=mk(t,f.cat,f.dist,'u1',null,'new',0,ds,+$('#f-due').value);r.x=f.x;r.y=f.y;r.addr=ad;r.ts=Date.now();r.log=[{s:'new',ts:r.ts}];
    D().reqs.unshift(r);note('admin','Новая заявка «'+t+'»');S.form=null;toast('Заявка отправлена вместе с локацией');S.view='mine';render()}
  if(id==='addhelper'){var n=$('#h-name').value.trim(),p=$('#h-phone').value.trim(),o=true;fail('e-hname','');fail('e-hphone','');
    if(n.split(/\s+/).filter(Boolean).length<1||n.length<2){fail('e-hname','Введите имя помощника.');o=false}
    if(p.replace(/\D/g,'').length<9){fail('e-hphone','Введите телефон, например +998 90 123-45-67.');o=false}
    if(!o)return;D().helpers.push({id:'h'+Date.now(),name:n,phone:p,dist:$('#h-dist').value,base:0,bp:0,rating:5,avail:true});toast('Помощник '+n+' добавлен');render()}
  if(id==='addcat'){var cn=$('#c-name').value.trim();fail('e-cname','');
    if(cn.length<2){fail('e-cname','Введите название категории.');return}
    if(D().cats.some(function(c){return c.n.toLowerCase()===cn.toLowerCase()})){fail('e-cname','Такая категория уже есть.');return}
    D().cats.push({n:cn,c:CATCOLORS[D().cats.length%CATCOLORS.length],i:'heart'});toast('Категория добавлена');render()}});

render();
})();
</script>
</body>
