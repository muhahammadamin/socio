# Деплой на Render в один клик: New → Blueprint → выбрать репозиторий.
# База данных — Turso (облачная SQLite): данные сохраняются при перезапусках,
# обновлениях и засыпании сервиса. После создания сервиса вставьте в панели
# Render (Environment) TURSO_DATABASE_URL и TURSO_AUTH_TOKEN из turso.tech.
# Без них база будет временной — внутри контейнера.
services:
  - type: web
    name: socio
    runtime: docker
    plan: free
    healthCheckPath: /api/health
    envVars:
      - key: DEMO
        value: "false"
      # Основной домен (например https://socio-help.uz): canonical, sitemap.xml и 301-переадресация
      # с www и onrender.com. Задайте в панели Render (Environment) ТОЛЬКО когда домен уже открывается,
      # иначе onrender.com начнёт переадресовывать на неработающий адрес.
      - key: SITE_URL
        sync: false
      - key: ADMIN_PHONE
        value: "+998 77-010-25-56"
      - key: ADMIN_PASSWORD
        generateValue: true
      - key: SECRET
        generateValue: true
      # Вход через Google: вставьте Client ID в панели Render (Environment) после создания сервиса
      - key: GOOGLE_CLIENT_ID
        sync: false
      # Turso: адрес базы (libsql://…) и токен доступа
      - key: TURSO_DATABASE_URL
        sync: false
      - key: TURSO_AUTH_TOKEN
        sync: false
