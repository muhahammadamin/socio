# Деплой на Render в один клик: New → Blueprint → выбрать репозиторий.
# Бесплатный тариф: диска нет, база SQLite живёт в контейнере и
# СТИРАЕТСЯ при каждом перезапуске/обновлении (и после засыпания сервиса).
# Для постоянной работы: plan: starter + блок disk (см. ниже).
services:
  - type: web
    name: socio
    runtime: docker
    plan: free
    healthCheckPath: /api/health
    envVars:
      - key: DEMO
        value: "false"
      - key: ADMIN_PASSWORD
        generateValue: true
      - key: SECRET
        generateValue: true
      # Вход через Google: вставьте Client ID в панели Render (Environment) после создания сервиса
      - key: GOOGLE_CLIENT_ID
        sync: false
    # Постоянное хранение данных (только на платном тарифе):
    # disk:
    #   name: socio-data
    #   mountPath: /data
    #   sizeGB: 1
